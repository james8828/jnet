# Annotation System - English Internationalization Resource File
# For Spring Validation and Custom Messages

# ==================== General Validation Messages ====================

# Parameter Validation
ARGUMENT_INVALID=Invalid parameters, please check your input
REQUIRED_FIELD_MISSING=Required field cannot be empty

# Data Not Found
NO_SLIDE_DATA=Slide ID cannot be empty
NO_ANNOTATION_DATA=Annotation ID cannot be empty
NO_IMAGE_DATA=Image ID cannot be empty
NO_TAG_DATA=Tag ID cannot be empty
DATA_NOT_FOUND=Data not found, please check the ID

# Data Format
INVALID_GEOMETRY=Invalid geometry format
INVALID_COORDINATES=Invalid coordinates
INVALID_AREA=Invalid area value
INVALID_PERIMETER=Invalid perimeter value

# Business Rules
ANNOTATION_EXISTS=Annotation already exists
ANNOTATION_NOT_FOUND=Annotation not found
TAG_NOT_FOUND=Tag not found
SLIDE_NOT_FOUND=Slide not found
USER_NOT_FOUND=User not found

# Operation Permissions
OPERATION_NOT_ALLOWED=Operation not allowed
ANNOTATION_LOCKED=Annotation is locked
ANNOTATION_IN_USE=Annotation is being used by another user

# Batch Operations
BATCH_OPERATION_FAILED=Batch operation failed
BATCH_SIZE_EXCEEDED=Batch size exceeded limit

