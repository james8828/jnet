
spring:
  jackson:
    # 序列化配置
    serialization:
      fail-on-empty-beans: false
      write-dates-as-timestamps: false
    # 反序列化配置
    deserialization:
      fail-on-unknown-properties: false
      accept-single-value-as-array: true
    # 日期格式
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  cloud:
    nacos:
      config:
        import-check:
          enabled: false
        server-addr: 192.168.52.108:8848
      discovery:
        auto-registration: true
        server-addr: 192.168.52.108:8848
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate  # 生产环境建议使用 validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        spatial:
          enabled: true
        type:
          descriptor:
            sql:
              SqlTypes:
                GEOMETRY: org.hibernate.type.descriptor.sql.GeometrySqlDescriptor
    open-in-view: false  # 性能优化
  data:
    redis:
      # Redis 服务器地址
      host: 192.168.160.103
      # Redis 服务器端口
      port: 6379
      # Redis 密码
      password: shengtong
      # Redis 数据库索引（0~15，默认为0）
      database: 10
      # Redis 连接超时时间
      timeout: 5000ms
      
      # Lettuce 连接池配置（Spring Boot 2.x+ 默认使用 Lettuce）
      lettuce:
        pool:
          max-active: 20        # 连接池最大连接数（负值表示无限制）
          max-idle: 10          # 连接池中的最大空闲连接
          min-idle: 5           # 连接池中的最小空闲连接
          max-wait: 3000ms      # 连接池最大阻塞等待时间（负值表示无限制）
        shutdown-timeout: 100ms # 关闭超时时间
  datasource:
    url: jdbc:postgresql://localhost:5432/jnet
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 5000
      validation-timeout: 5000
      auto-commit: true
      pool-name: "HikariCP"
      connection-test-query: "SELECT 1"
      register-mbeans: true
  thymeleaf:
    check-template-location: false
    cache: false
    prefix: classpath:/templates/
    encoding: UTF-8 #编码
    suffix: .html #模板后缀
    mode: HTML #模板
#prometheus配置
info:
  alen: alen
management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: "*"
  metrics:
    tags:
      application: ${spring.application.name}
# SpringDoc OpenAPI + Knife4j 配置
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  packages-to-scan: com.jnet.anno.controller
  default-flat-param-object: true

# Knife4j 配置
knife4j:
  enable: true
  production: false
  # 禁用增强功能，避免 Base64 编码
  basic:
    enable: false
  setting:
    language: zh_cn
    # 禁用文档增强
    enable-document-cache: false
netty:
  port: 7777


