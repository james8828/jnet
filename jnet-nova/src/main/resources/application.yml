spring:
  application:
    name: jnet-nova
  main:
    web-application-type: servlet

# DML Protocol Server Configuration
dml:
  server:
    port: 57380
    boss-threads: 1
    worker-threads: 0
    read-idle-seconds: 60
    write-idle-seconds: 60
    kpa-interval-seconds: 60
    max-kpa-timeouts: 4
    max-message-size: 32768

# Database Configuration (defaults to H2 for development)
spring.datasource:
  url: jdbc:h2:mem:jnetnova;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
  driver-class-name: org.h2.Driver
  username: sa
  password: password
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      continue-on-error: true
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        hbm2ddl:
          auto: none

bioconnect:
  # Inbound MLLP server: receives ADT from HIS (RTMADTP entry point)
  inbound:
    enabled: true
    port: 57399
    worker-threads: 4
  # Outbound MLLP client: forwards Results (ORU^R01 / OUL^R21) to LIS/HIS (RTMLIS exit point)
  lis:
    enabled: true
    host: 127.0.0.1
    port: 2590
    reconnect-delay-ms: 5000
  # DML TCP server: receives OBS/SVC from devices (RTMLIS entry point)
  dml:
    enabled: true
    port: 57381
  # DML TCP client: pushes PAT/OPL to device (RTMADTP/RTMOPL exit point)
  device:
    enabled: true
    host: 127.0.0.1
    port: 57380
    reconnect-delay-ms: 5000
  # Default MSH identities used when Bio-Connect originates a message
  sending-application: BIO-CONNECT
  sending-facility: NOVA
  processing-id: P        # P = Production, D = Debug
  version: "2.4"
  charset: UTF-8

  # === 定时同步任务配置 ===
  sync:
    enabled: true
    # 患者同步（从 HIS 查询在院患者，对比获取变更后推送）
    patient:
      enabled: true
      # 查询策略：database(数据库直连), rest(RESTful API)
      strategy: database
      # 同步间隔（秒）
      interval-seconds: 60
      # 启动时立即执行一次全量同步
      sync-on-startup: true
      # HIS 数据库配置（strategy=database 时使用）
      database:
        url: jdbc:sybase:Tds:172.31.0.52:26383?ServiceName=rtmbackend
        username: dba
        password: ab3dq@RND
      # HIS RESTful API 配置（strategy=rest 时使用）
      rest:
        base-url: http://his-server:8080/api
        api-key: your-api-key
    # 医护人员同步（从 HIS 查询院内医护，对比获取变更后推送）
    operator:
      enabled: true
      strategy: database
      interval-seconds: 300
      sync-on-startup: true
      database:
        url: jdbc:sybase:Tds:172.31.0.52:26383?ServiceName=rtmbackend
        username: dba
        password: ab3dq@RND
      rest:
        base-url: http://his-server:8080/api
        api-key: your-api-key

logging:
  level:
    com.nova.bioconnect: INFO
    io.netty: INFO
